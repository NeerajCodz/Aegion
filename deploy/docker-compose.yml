# Core is the only gateway. External modules are independently scheduled private workloads.
# Use docker-compose.prod.yml for production secrets and TLS material.

services:
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [aegion-internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aegion-internal]
    restart: unless-stopped

  loza-collector:
    image: ${LOZA_COLLECTOR_IMAGE:-ghcr.io/astraive/loza-collector:v0.3.3}
    environment:
      LOZA_EVENTBUS: memory
      COLLECTOR_RELIABILITY_MODE: direct
      COLLECTOR_AUTH_SERVER_SECRET: ${LOZA_COLLECTOR_AUTH_SERVER_SECRET:-dev-server-secret-change-me}
      COLLECTOR_INGEST_KEY_SECRET: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
    volumes:
      - loza-data:/app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9308/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aegion-internal]
    restart: unless-stopped


  migration:
    image: ${AEGION_CORE_IMAGE:-aegion/aegion-core:dev}
    command: ["migrate", "--config", "/config/aegion.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [aegion-internal]
    restart: "no"

  aegion:
    image: ${AEGION_CORE_IMAGE:-aegion/aegion-core:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
    depends_on:
      migration:
        condition: service_completed_successfully
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-admin:
    image: ${AEGION_MODULE_ADMIN_IMAGE:-aegion/aegion-admin:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: admin
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9003
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-analytics:
    image: ${AEGION_MODULE_ANALYTICS_IMAGE:-aegion/aegion-analytics:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: analytics
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:8082
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-oauth2:
    image: ${AEGION_MODULE_OAUTH2_IMAGE:-aegion/aegion-oauth2:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: oauth2
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9005
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-social:
    image: ${AEGION_MODULE_SOCIAL_IMAGE:-aegion/aegion-social:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: social
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9006
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-sso:
    image: ${AEGION_MODULE_SSO_IMAGE:-aegion/aegion-sso:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: sso
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9007
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-introspection:
    image: ${AEGION_MODULE_INTROSPECTION_IMAGE:-aegion/aegion-introspection:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: introspection
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9008
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-proxy:
    image: ${AEGION_MODULE_PROXY_IMAGE:-aegion/aegion-proxy:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: proxy
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9009
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-mfa:
    image: ${AEGION_MODULE_MFA_IMAGE:-aegion/aegion-mfa:dev}
    environment:
      AEGION_LOZA_COLLECTOR_URL: http://loza-collector:9308/events
      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: mfa
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9003
    depends_on:
