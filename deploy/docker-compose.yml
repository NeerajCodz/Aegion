    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  module-passkeys:
    image: ${AEGION_MODULE_PASSKEYS_IMAGE:-aegion/aegion-passkeys:dev}
    environment:
