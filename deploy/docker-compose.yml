      AEGION_LOZA_API_KEY: ${AEGION_LOZA_API_KEY:-dev-ingest-key-change-me}
      AEGION_MODULE_ID: passkeys
      AEGION_HTTP_LISTEN_ADDR: 0.0.0.0:9004
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  aegion-cli:
    image: ${AEGION_MODULE_CLI_IMAGE:-aegion/aegion-cli:dev}
    profiles: [operator]
    depends_on:
      aegion:
        condition: service_healthy
    networks: [aegion-internal]
    read_only: true
    tmpfs: [/tmp]
    restart: "no"

networks:
  aegion-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  aegion-data:
  loza-data:
