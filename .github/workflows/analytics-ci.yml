# =============================================================================
# Aegion Analytics CI Pipeline
# Specialized testing, linting, and deployment for analytics module
# =============================================================================

name: Analytics CI

on:
  push:
    branches: [main, beta]
    paths:
      - 'modules/analytics/**'
      - '.github/workflows/analytics-ci.yml'
  pull_request:
    branches: [main, beta]
    paths:
      - 'modules/analytics/**'
      - '.github/workflows/analytics-ci.yml'
  workflow_dispatch:

env:
  GO_VERSIONS: '1.23,1.24,1.25'
  COVERAGE_THRESHOLD: '85'
  REGISTRY: ghcr.io
  IMAGE_NAME: analytics

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Analytics Lint
  # ---------------------------------------------------------------------------
  analytics-lint:
    name: Analytics Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(find ./modules/analytics -type f -name '*.go' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Code is not formatted. Run 'gofmt -w ./modules/analytics'"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./modules/analytics/...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          working-directory: ./modules/analytics
          args: --timeout=5m --tests=true

  # ---------------------------------------------------------------------------
  # Analytics Security Scanning
  # ---------------------------------------------------------------------------
  analytics-security:
    name: Analytics Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run gosec
        uses: securego/gosec@v2.26.1
        with:
          args: -severity high -confidence high -exclude-generated ./modules/analytics/...

  # ---------------------------------------------------------------------------
  # Analytics Tests - Multi-Version Matrix
  # ---------------------------------------------------------------------------
  analytics-test:
    name: Analytics Test Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    needs: [analytics-lint, analytics-security]
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.0', '1.24.0', '1.25.9']
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Wait for postgres
        run: |
          until pg_isready -h localhost -U analytics -d analytics_test; do
            sleep 1
          done
        env:
          PGPASSWORD: analytics

      - name: Run migrations
        working-directory: ./modules/analytics
        run: |
          go run -tags migration ./... up
        env:
          DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics_test?sslmode=disable

      - name: Run tests
        working-directory: ./modules/analytics
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... \
            -timeout 30s
        env:
          DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics_test?sslmode=disable
          DUCKDB_DATABASE: ':memory:'

      - name: Check coverage
        working-directory: ./modules/analytics
        run: |
          total=$(go tool cover -func coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $total%"
          threshold=${{ env.COVERAGE_THRESHOLD }}
          if awk "BEGIN {exit !($total < $threshold)}"; then
            echo "Coverage $total% is below threshold of $threshold%"
            exit 1
          fi
          echo "Coverage $total% meets threshold of $threshold%"

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./modules/analytics/coverage.out
          flags: analytics
          name: analytics-go-${{ matrix.go-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Analytics Migration Testing
  # ---------------------------------------------------------------------------
  analytics-migrations:
    name: Analytics Migrations
    runs-on: ubuntu-latest
    needs: [analytics-lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: true

      - name: Wait for postgres
        run: |
          until pg_isready -h localhost -U analytics -d analytics_test; do
            sleep 1
          done
        env:
          PGPASSWORD: analytics

      - name: Test migration up
        working-directory: ./modules/analytics
        run: |
          go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics_test?sslmode=disable

      - name: Verify schema
        run: |
          PGPASSWORD=analytics psql -h localhost -U analytics -d analytics_test -c "\dt"

      - name: Test migration rollback
        working-directory: ./modules/analytics
        run: |
          go run ./cmd/migrate down
        env:
          DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics_test?sslmode=disable

      - name: Test re-migration
        working-directory: ./modules/analytics
        run: |
          go run ./cmd/migrate up
        env:
          DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics_test?sslmode=disable

  # ---------------------------------------------------------------------------
  # Analytics Docker Build
  # ---------------------------------------------------------------------------
  analytics-docker:
    name: Analytics Docker Build
    runs-on: ubuntu-latest
    needs: [analytics-test, analytics-migrations]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Normalize image prefix
        id: image-prefix
        run: echo "image_prefix=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-prefix.outputs.image_prefix }}/analytics
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: modules/analytics/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.event_name == 'workflow_dispatch') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Analytics E2E Tests
  # ---------------------------------------------------------------------------
  analytics-e2e:
    name: Analytics E2E Tests
    runs-on: ubuntu-latest
    needs: [analytics-docker]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: true

      - name: Wait for postgres
        run: |
          until pg_isready -h localhost -U analytics -d analytics_test; do
            sleep 1
          done
        env:
          PGPASSWORD: analytics

      - name: Run E2E tests
        working-directory: ./modules/analytics
        run: |
          go test -v -tags=e2e ./e2e/... -timeout 60s
        env:
          DATABASE_URL: postgres://analytics:analytics@localhost:5432/analytics_test?sslmode=disable
          ANALYTICS_API_URL: http://localhost:8080

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  analytics-summary:
    name: Analytics CI Summary
    runs-on: ubuntu-latest
    needs: [analytics-lint, analytics-security, analytics-test, analytics-migrations, analytics-docker, analytics-e2e]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Analytics CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.analytics-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.analytics-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.analytics-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.analytics-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.analytics-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.analytics-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
