# =============================================================================
# Aegion CI Pipeline
# Runs linting, testing, and coverage for Go and Rust code
# =============================================================================

name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

env:
  GO_VERSION: '1.25.8'
  RUST_VERSION: 'stable'
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Go Linting
  # ---------------------------------------------------------------------------
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(find . -type f -name '*.go' -not -path '*/node_modules/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: |
          packages=$(go list ./... | grep -v '/node_modules/' | grep -Ev '(^\.|/\.)' || true)
          if [ -z "$packages" ]; then
            echo "No Go packages found for vet"
            exit 1
          fi
          go vet $packages

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --timeout=5m --tests=false --disable=unused

  # ---------------------------------------------------------------------------
  # Rust Linting
  # ---------------------------------------------------------------------------
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Determine Module Scope for Per-Module Checks
  # ---------------------------------------------------------------------------
  detect-modules:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_modules: ${{ steps.detect.outputs.has_modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          to_json() {
            python3 -c "import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))"
          }

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
            if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          head_sha="${{ github.sha }}"

          changed_files="$(git diff --name-only "$base_sha" "$head_sha" || true)"
          echo "Changed files between $base_sha and $head_sha:"
          echo "${changed_files:-<none>}"

          mapfile -t all_modules < <(find modules -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ "${#all_modules[@]}" -eq 0 ]]; then
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shared_change_regex='^(internal/|proto/|core/|cmd/|configs/|go\.mod$|go\.sum$|scripts/|build/|\.github/workflows/(ci|release)\.yml$)'
          if [[ -n "$changed_files" ]] && grep -Eq "$shared_change_regex" <<<"$changed_files"; then
            modules_json="$(printf '%s\n' "${all_modules[@]}" | to_json)"
          else
            changed_modules="$(sed -nE 's#^modules/([^/]+)(/.*)?$#\1#p' <<<"$changed_files" | sort -u)"
            modules_json="$(printf '%s\n' "$changed_modules" | to_json)"
          fi

          if [[ "$modules_json" == "[]" ]]; then
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          fi

          echo "modules=$modules_json" >> "$GITHUB_OUTPUT"
          echo "Module matrix: $modules_json"

  # ---------------------------------------------------------------------------
  # Per-Module Verification (path-scoped, shared changes fan out)
  # ---------------------------------------------------------------------------
  module-check:
    name: Module Check (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: detect-modules
    if: ${{ (github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true') && needs.detect-modules.outputs.has_modules == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check module boundaries
        run: bash ./scripts/check-module-boundaries.sh "${{ matrix.module }}"

      - name: Vet module
        run: go vet ./modules/${{ matrix.module }}/...

      - name: Test module
        run: go test -count=1 ./modules/${{ matrix.module }}/...

      - name: Build module image
        if: hashFiles(format('modules/{0}/Dockerfile', matrix.module)) != ''
        run: |
          docker build \
            -f modules/${{ matrix.module }}/Dockerfile \
            -t aegion-${{ matrix.module }}:ci-${{ github.sha }} \
            --build-arg VERSION=ci-${{ github.sha }} \
            .

  # ---------------------------------------------------------------------------
  # Proto Generation Consistency
  # ---------------------------------------------------------------------------
  proto-consistency:
    name: Proto Consistency
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated protobuf stubs are current
        run: bash ./scripts/check-proto-consistency.sh

  # ---------------------------------------------------------------------------
  # Release Manifest Discipline
  # ---------------------------------------------------------------------------
  release-manifest:
    name: Release Manifest Check
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate release manifest schema and coverage
        run: bash ./scripts/check-release-manifest.sh

  # ---------------------------------------------------------------------------
  # Go Tests with Coverage
  # ---------------------------------------------------------------------------
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: [go-lint, proto-consistency]
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Rust (for CGO)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build Rust libraries
        working-directory: rust
        run: cargo build --release --workspace

      - name: Run tests with coverage
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS: "-L${{ github.workspace }}/rust/target/release"
        run: |
          packages=$(go list ./... | grep -v '/node_modules/' | grep -Ev '(^\.|/\.)' || true)
          if [ -z "$packages" ]; then
            echo "No Go packages found for test"
            exit 1
          fi

          skip_regex='/modules/oauth2/store$|/modules/oauth2/cmd/server$|/core/courier$|/core/proxy$|/internal/platform/crypto$|/internal/platform/jwt$|/modules/admin/cmd/admin$|/tests/e2e$|/internal/proto/|/cmd/aegion$|/modules/(cli|introspection|mfa|passkeys|proxy|social|sso)/cmd/server$'
          coverage_packages=$(echo "$packages" | tr ' ' '\n' | grep -Ev "$skip_regex" | tr '\n' ' ' | xargs)

          if [ -z "$coverage_packages" ]; then
            echo "No Go packages found for coverage"
            exit 1
          fi

          go test -short -v -race -coverprofile=coverage.out -covermode=atomic $coverage_packages

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $total%"
          threshold=95
          # Use awk for floating point comparison instead of bc
          if awk "BEGIN {exit !($total < $threshold)}"; then
            echo "Coverage $total% is below threshold of $threshold%"
            exit 1
          fi
          echo "Coverage $total% meets threshold of $threshold%"

      - name: Upload Go coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Integration Smoke Checks
  # ---------------------------------------------------------------------------
  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: go-test
    if: ${{ (github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true') && (github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_INTEGRATION_SMOKE == 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run critical smoke tests
        run: bash ./scripts/run-integration-smoke.sh

  # ---------------------------------------------------------------------------
  # Rust Tests with Coverage
  # ---------------------------------------------------------------------------
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: rust-lint
    if: ${{ github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v6
        with:
          files: rust/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # CI Summary
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - go-lint
      - rust-lint
      - detect-modules
      - module-check
      - proto-consistency
      - release-manifest
      - go-test
      - integration-smoke
      - rust-test
    if: ${{ (github.repository_owner == 'Qypher' || vars.AEGION_ENABLE_FORK_WORKFLOWS == 'true') && always() }}
    steps:
      - name: Check all jobs passed
        shell: bash
        run: |
          check_result() {
            local job="$1"
            local result="$2"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job '$job' finished with status '$result'"
              return 1
            fi
            return 0
          }

          check_result "go-lint" "${{ needs.go-lint.result }}"
          check_result "rust-lint" "${{ needs.rust-lint.result }}"
          check_result "detect-modules" "${{ needs.detect-modules.result }}"
          check_result "module-check" "${{ needs.module-check.result }}"
          check_result "proto-consistency" "${{ needs.proto-consistency.result }}"
          check_result "release-manifest" "${{ needs.release-manifest.result }}"
          check_result "go-test" "${{ needs.go-test.result }}"
          check_result "integration-smoke" "${{ needs.integration-smoke.result }}"
          check_result "rust-test" "${{ needs.rust-test.result }}"

          echo "All CI checks passed!"
