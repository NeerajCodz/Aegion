# =============================================================================
# Aegion CI Pipeline
# Runs linting, testing, and coverage for Go and Rust code
# =============================================================================

name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

env:
  GO_VERSION: '1.25.8'
  RUST_VERSION: '1.81.0'
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Go Linting
  # ---------------------------------------------------------------------------
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(find . -type f -name '*.go' -not -path '*/node_modules/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Code is not formatted. Run 'gofmt -w .'"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: |
          packages=$(go list ./... | grep -v '/node_modules/' | grep -Ev '(^\.|/\.)' || true)
          if [ -z "$packages" ]; then
            echo "No Go packages found for vet"
            exit 1
          fi
          go vet $packages

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # ---------------------------------------------------------------------------
  # Rust Linting
  # ---------------------------------------------------------------------------
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Go Tests with Coverage
  # ---------------------------------------------------------------------------
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: go-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Rust (for CGO)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Build Rust libraries
        working-directory: rust
        run: cargo build --release --workspace

      - name: Run tests with coverage
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS: "-L${{ github.workspace }}/rust/target/release"
        run: |
          packages=$(go list ./... | grep -v '/node_modules/' | grep -Ev '(^\.|/\.)' || true)
          if [ -z "$packages" ]; then
            echo "No Go packages found for test"
            exit 1
          fi

          excluded_regex='/modules/oauth2/store$|/modules/oauth2/cmd/server$'
          coverage_packages=$(echo "$packages" | tr ' ' '\n' | grep -Ev "$excluded_regex" | tr '\n' ' ' | xargs)
          excluded_packages=$(echo "$packages" | tr ' ' '\n' | grep -E "$excluded_regex" | tr '\n' ' ' | xargs || true)

          if [ -z "$coverage_packages" ]; then
            echo "No Go packages found for coverage"
            exit 1
          fi

          go test -v -race -coverprofile=coverage.out -covermode=atomic $coverage_packages

          if [ -n "$excluded_packages" ]; then
            echo "Running race tests for excluded packages: $excluded_packages"
            go test -v -race $excluded_packages
          fi

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Coverage: $total%"
          threshold=95
          # Use awk for floating point comparison instead of bc
          if awk "BEGIN {exit !($total < $threshold)}"; then
            echo "Coverage $total% is below threshold of $threshold%"
            exit 1
          fi
          echo "Coverage $total% meets threshold of $threshold%"

      - name: Upload Go coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Rust Tests with Coverage
  # ---------------------------------------------------------------------------
  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: rust-lint
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v6
        with:
          files: rust/lcov.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # CI Summary
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [go-lint, rust-lint, go-test, rust-test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.go-lint.result }}" != "success" ]] || \
             [[ "${{ needs.rust-lint.result }}" != "success" ]] || \
             [[ "${{ needs.go-test.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
