# =============================================================================
# Aegion Security Scanning Pipeline
# Runs security scans for Go, Rust, and container images
# =============================================================================

name: Security

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    # Run security scans daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.9'
  RUST_VERSION: 'stable'

jobs:
  # ---------------------------------------------------------------------------
  # Go Security Scanning
  # ---------------------------------------------------------------------------
  gosec:
    name: Go Security (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@v2.26.1
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('gosec-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Run gosec with failure on high severity
        uses: securego/gosec@v2.26.1
        with:
          args: -severity high -confidence high -exclude-generated ./...

  # ---------------------------------------------------------------------------
  # Rust Dependency Audit
  # ---------------------------------------------------------------------------
  cargo-audit:
    name: Rust Security (cargo-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run cargo deny
        run: cargo deny check advisories

  # ---------------------------------------------------------------------------
  # Container Scanning with Trivy
  # ---------------------------------------------------------------------------
  trivy:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.core
          push: false
          load: true
          tags: aegion/core:scan
          cache-from: type=gha
          build-args: |
            VERSION=security-scan
            BASE_IMAGE=golang:1.25.8-bookworm
            RUNTIME_IMAGE=debian:bookworm-slim
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (filesystem)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.69.3 fs \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --pkg-types os,library \
            --format sarif \
            --output trivy-fs-results.sarif \
            .

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-fs-results.sarif
          category: 'trivy-fs'

      - name: Run Trivy on container image
        if: success()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            -w /work \
            aquasec/trivy:0.69.3 image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --pkg-types os,library \
            --format sarif \
            --output trivy-image-results.sarif \
            aegion/core:scan

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: 'trivy-image'

  # ---------------------------------------------------------------------------
  # Dependency Review (for PRs)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  # ---------------------------------------------------------------------------
  # Secret Scanning
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Security Summary
  # ---------------------------------------------------------------------------
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gosec, cargo-audit, trivy, secrets]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| gosec (Go) | ${{ needs.gosec.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cargo-audit (Rust) | ${{ needs.cargo-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (Container) | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks (Secrets) | ${{ needs.secrets.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: |
          needs.gosec.result == 'failure' ||
          needs.cargo-audit.result == 'failure' ||
          needs.trivy.result == 'failure' ||
          needs.secrets.result == 'failure'
        run: |
          echo "::error::One or more security scans failed"
          exit 1
